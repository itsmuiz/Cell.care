<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist | Cell Care India</title>
  <meta name="theme-color" content="#159447" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/storefront.css?v=3" />
</head>
<body>

  <div id="ccHeaderMount"></div>

  <div class="cc-breadcrumb-bar">
    <div class="container">
      <a href="index.html">Home</a> <span class="cc-breadcrumb-sep">/</span> <span>Wishlist</span>
    </div>
  </div>

  <main class="container" style="padding-bottom:60px; min-height:46vh;">
    <h1 class="cc-page-title">My Wishlist</h1>
    <div id="ccWishlistMount"></div>
  </main>

  <div id="ccFooterMount"></div>

  <script src="assets/js/api-config.js?v=3"></script>
  <script src="assets/js/store-core.js?v=3"></script>
  <script>
    async function renderWishlistPage() {
      const CC = window.CellCare;
      const mount = document.getElementById("ccWishlistMount");
      if (!mount) return;
      const res = await CC.fetchProducts();
      const all = res.items || [];
      const items = CC.wishlist.map(id => all.find(p => String(p.id) === String(id))).filter(Boolean);

      if (!items.length) {
        mount.innerHTML = `
          <div style="max-width:900px; margin:0 auto;">
            <div class="cc-empty-notice">
              <i class="far fa-heart" style="color:var(--brand-green); font-size:18px;"></i>
              <span>Your wishlist is currently empty. Save EV parts, cells, and tools to enquire anytime.</span>
            </div>
            <a href="shop.html" class="cc-btn-primary" style="padding:12px 26px;">Browse Products</a>
          </div>
        `;
        return;
      }

      mount.innerHTML = `<div class="cc-shop-grid">${items.map(p => CC.renderProductCard(p)).join("")}</div>`;
    }
    document.addEventListener("DOMContentLoaded", () => setTimeout(renderWishlistPage, 40));
    window.addEventListener("cellcare:wishlist-updated", renderWishlistPage);
  </script>
</body>
</html>
